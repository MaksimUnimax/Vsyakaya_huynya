name: Ludka Polymarket Bridge

on:
  push:
    branches: ["лудка"]
    paths:
      - "repo-radar/ludka/polymarket-bridge/**"
      - ".github/workflows/ludka-polymarket-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check repo-radar/ludka/polymarket-bridge/src/protocol.js
          node --check repo-radar/ludka/polymarket-bridge/src/service_worker.js
          node --check repo-radar/ludka/polymarket-bridge/src/content_script.js
          node --check repo-radar/ludka/polymarket-bridge/src/popup.js
          node --check repo-radar/ludka/polymarket-bridge/src/file_artifact_store.js
          node --check repo-radar/ludka/polymarket-bridge/src/chatgpt_file_attachment.js
          node --check repo-radar/ludka/polymarket-bridge/src/file_delivery_content.js
          node -e 'JSON.parse(require("fs").readFileSync("repo-radar/ludka/polymarket-bridge/src/manifest.json","utf8")); console.log("manifest: PASS")'
      - name: Protocol tests
        run: node repo-radar/ludka/polymarket-bridge/tests/protocol.test.mjs
      - name: File-delivery contract tests
        run: node repo-radar/ludka/polymarket-bridge/tests/file_delivery_contract.test.mjs
      - name: Build installable ZIP
        run: |
          cd repo-radar/ludka/polymarket-bridge/src
          zip -r ../polymarket-bridge-0.1.1.zip .
          cd ..
          sha256sum polymarket-bridge-0.1.1.zip
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-bridge-0.1.1
          path: repo-radar/ludka/polymarket-bridge/polymarket-bridge-0.1.1.zip
          if-no-files-found: error
