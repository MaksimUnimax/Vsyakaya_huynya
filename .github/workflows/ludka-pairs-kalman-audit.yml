name: Ludka Pairs Kalman Audit

on:
  push:
    branches:
      - 'лудка'
    paths:
      - 'repo-radar/ludka/audits/pairs_kalman_audit.py'
      - '.github/workflows/ludka-pairs-kalman-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run audit
        run: python repo-radar/ludka/audits/pairs_kalman_audit.py | tee pairs-audit-console.txt
      - name: Show report
        if: always()
        run: test -f audit-out-pairs/report.md && cat audit-out-pairs/report.md || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairs-kalman-audit
          if-no-files-found: warn
          path: |
            audit-out-pairs/report.md
            audit-out-pairs/result.json
            pairs-audit-console.txt
